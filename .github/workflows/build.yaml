name: Build with Gradle

on: [push, pull_request]

permissions:
    contents: write

jobs:
  build:
    # Only run on PRs if the source branch is on a different repo. We do not need to run everything twice.
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v3
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Create artifact name
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ steps.vars.outputs.sha_short }}
          path: build/libs/*instrumented.jar
      # Run the verifier through Gradle rather than a separate action, so the IDE
      # list has one source of truth in build.gradle.kts. A second, independently
      # configured verifier drifts from the first one without anything noticing.
      - name: Verify plugin
        run: ./gradlew verifyPlugin
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          # The build output is still in the workspace; it used to be re-downloaded
          # from the artifact store only because the verifier action needed it there.
          files: build/libs/*instrumented.jar
      - name: Publish plugin
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          ./gradlew publishPlugin -x verifyPluginConfiguration
        env:
          PLUGIN_PUBLISH_TOKEN: ${{ secrets.PLUGIN_PUBLISH_TOKEN }}
