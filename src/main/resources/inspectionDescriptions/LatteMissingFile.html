<html>
<body>
Reports a template named in <code>{include}</code>, <code>{import}</code>, <code>{extends}</code>,
<code>{layout}</code>, <code>{embed}</code> or <code>{sandbox}</code> that does not exist, relative to the
template that names it.
<p>Only a literal path is checked. A path built from a variable or a function call is left alone,
because the plugin cannot know which file it names.</p>
</body>
</html>
