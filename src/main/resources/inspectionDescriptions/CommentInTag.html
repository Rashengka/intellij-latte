<body>
Reports a line comment - <code>//</code> or <code>#</code> - inside a Latte tag.
<p>Inside a tag Latte knows only the block comment <code>/* ... */</code>. A line comment is not a comment
there: Latte refuses the tag with <i>Unexpected '/'</i> or <i>Unexpected '#'</i>, and where nothing follows
it in the tag, it hides what Latte writes after the tag.</p>
</body>
